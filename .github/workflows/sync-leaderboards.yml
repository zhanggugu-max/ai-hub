name: Sync OpenRouter AI Leaderboards

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动同步一次最新模型榜单与定价
    - cron: '0 2 * * *'
  # 支持在 GitHub Actions 网页端手动点击 "Run workflow" 立即触发同步
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-leaderboards:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync OpenRouter leaderboards to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --no-install tsx scripts/sync-openrouter.ts

      - name: Sync AI resources and Daily Papers to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --no-install tsx scripts/sync-resources.ts
