name: Sync OpenRouter AI Leaderboards

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动同步一次最新模型榜单与定价
    - cron: '0 2 * * *'
  # 支持在 GitHub Actions 网页端手动点击 "Run workflow" 立即触发同步
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-leaderboards:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync OpenRouter leaderboards to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/sync-openrouter.ts
